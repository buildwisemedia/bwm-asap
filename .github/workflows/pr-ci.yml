name: PR CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test CAPI auth probe
        run: node --experimental-strip-types --test tests/capi-auth-probe.test.mjs
      - name: Test attribution
        run: node attribution.test.js
      - name: Run production QA
        run: bash scripts/production-gate.sh qa-gate .
